services:
  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: [smtp-test]
    restart: unless-stopped
    mem_limit: 96m
    environment:
      MP_MAX_MESSAGES: '500'
    ports: [127.0.0.1:18025:8025]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 10
  notification-service:
    environment:
      SMTP_ENABLED: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_FROM: orders@example.com
    depends_on:
      mailpit:
        condition: service_healthy
