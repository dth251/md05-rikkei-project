global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api-gateway:8080]
        labels: {service: api-gateway}
      - targets: [auth-service:8081]
        labels: {service: auth-service}
      - targets: [product-service:8082]
        labels: {service: product-service}
      - targets: [order-service:8083]
        labels: {service: order-service}
      - targets: [notification-service:8084]
        labels: {service: notification-service}
      - targets: [payment-service:8085]
        labels: {service: payment-service}
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
