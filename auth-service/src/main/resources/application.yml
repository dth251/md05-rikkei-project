notification:
  recipient-token: ${NOTIFICATION_RECIPIENT_TOKEN:}

server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        jvm.gc.pause: true
        http.server.requests: true
        spring.cloud.gateway.requests: true
        commerce.order.product.rpc.duration: true
        commerce.product.rpc.duration: true
    tags:
      application: auth-service
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  issuer: omnichannel-auth
  ttl: PT15M

auth:
  refresh-ttl: P7D

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    enabled: false
