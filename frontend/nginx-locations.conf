# Insert these locations in the project's HTTPS server block.
# Keep /api/, /swagger-ui/ and /gateway-status from gateway.conf.template.
location = /actuator { return 404; }
location ^~ /actuator/ { return 404; }
location ^~ /v3/api-docs { return 404; }
location ^~ /internal/ { return 404; }

location = / {
    root /var/www/md05-frontend/current;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";
}

location /assets/ {
    root /var/www/md05-frontend/current;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

location / {
    root /var/www/md05-frontend/current;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
}
