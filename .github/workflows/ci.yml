name: Auth CI/CD

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'auth-service/**'
      - 'infrastructure/**'
      - 'docker-compose*.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Auth Java tests and artifact
        id: java
        working-directory: auth-service
        run: ./gradlew clean test bootJar --no-daemon
      - name: Start and verify infrastructure
        id: infrastructure
        run: |
          bash infrastructure/scripts/generate-env.sh
          docker compose up -d --wait --wait-timeout 180 postgres rabbitmq
          docker compose run --rm --no-deps rabbitmq-topology
          bash infrastructure/scripts/verify-infrastructure.sh
      - name: Verify real PostgreSQL, Auth container and restart using Java
        id: live
        run: |
          docker compose build auth-service
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --wait --wait-timeout 180 postgres
          docker compose up -d --no-deps --wait --wait-timeout 180 auth-service
          bash infrastructure/scripts/test-auth-live.sh
      - name: Save Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-java-test-reports
          path: |
            auth-service/build/reports/tests/
            auth-service/build/test-results/
      - name: Save tested Auth artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-tested-jar
          path: auth-service/build/libs/app.jar
          retention-days: 7
      - name: Stop CI containers
        if: always()
        run: docker compose down
      - name: Record verification against push milestone
        if: always()
        env:
          MILESTONE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          JAVA_RESULT: ${{ steps.java.outcome }}
          INFRA_RESULT: ${{ steps.infrastructure.outcome }}
          LIVE_RESULT: ${{ steps.live.outcome }}
        run: |
          milestone="${MILESTONE:-$(git log -1 --format=%s)}"
          {
            printf '### %s\n\n' "$milestone"
            printf -- '- Commit tested: `%s`\n' "$GITHUB_SHA"
            printf -- '- Time (UTC): `%s`\n' "$(date -u +%FT%TZ)"
            printf -- '- Auth Java tests/build: %s\n' "$JAVA_RESULT"
            printf -- '- PostgreSQL/RabbitMQ: %s\n' "$INFRA_RESULT"
            printf -- '- Auth API/PostgreSQL/restart: %s\n' "$LIVE_RESULT"
            printf -- '- Reports: auth-java-test-reports artifact\n'
            printf -- '- VPS deployment is recorded separately by the deploy job.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auth-tested-jar
          path: auth-service/build/libs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: auth-service
          file: auth-service/Dockerfile.runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/auth-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record published image against push milestone
        if: always()
        env:
          IMAGE_RESULT: ${{ steps.image.outcome }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf '### %s\n\n' "$(git log -1 --format=%s)"
            printf -- '- GHCR publish: %s\n' "$IMAGE_RESULT"
            printf -- '- Image: `ghcr.io/%s/auth-service:%s`\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Time (UTC): `%s`\n' "$(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: vps-auth-deployment
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_PATH }}
      IMAGE_TAG: ${{ github.sha }}
      AUTH_IMAGE: ghcr.io/${{ github.repository }}/auth-service
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate settings and install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Transfer immutable release configuration
        run: |
          set -euo pipefail
          tar -czf release.tar.gz docker-compose.yml docker-compose.production.yml infrastructure
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_ROOT/releases/$IMAGE_TAG'"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes release.tar.gz "$VPS_USER@$VPS_HOST:$DEPLOY_ROOT/releases/$IMAGE_TAG/"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_ROOT/releases/$IMAGE_TAG' && tar -xzf release.tar.gz && test -f '$DEPLOY_ROOT/.env' && ln -sfn '$DEPLOY_ROOT/.env' .env"
      - name: Pull tested image and deploy only Auth
        id: rollout
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="cd '$DEPLOY_ROOT/releases/$IMAGE_TAG' && export DOCKER_CONFIG=\$(mktemp -d) && trap 'rm -f \"\$DOCKER_CONFIG/config.json\"; rmdir \"\$DOCKER_CONFIG\"' EXIT && docker login ghcr.io --username '$REGISTRY_USER' --password-stdin && IMAGE_TAG='$IMAGE_TAG' AUTH_IMAGE='$AUTH_IMAGE' DEPLOY_ROOT='$DEPLOY_ROOT' bash infrastructure/scripts/deploy.sh"
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$remote"
      - name: Record VPS deployment against push milestone
        if: always()
        env:
          DEPLOY_RESULT: ${{ steps.rollout.outcome }}
        run: |
          {
            printf '### %s\n\n' "$(git log -1 --format=%s)"
            printf -- '- Auth deployment/health/smoke: %s\n' "$DEPLOY_RESULT"
            printf -- '- Image commit: `%s`\n' "$IMAGE_TAG"
            printf -- '- Time (UTC): `%s`\n' "$(date -u +%FT%TZ)"
            printf -- '- A failed deployment is not marked complete; see rollback/job logs.\n'
          } >> "$GITHUB_STEP_SUMMARY"
