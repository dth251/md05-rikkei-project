name: Services CI/CD

on:
  push:
    branches: [main, 'feature/**']
    paths: ['*-service/**', 'api-gateway/**', 'infrastructure/**', 'tests/**', 'docker-compose*.yml', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            paths=docker-compose.yml
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            baseline="$(git merge-base HEAD origin/main)"
            paths="$(git diff --name-only "$baseline" HEAD)"
          else
            paths="$(git diff --name-only "$BEFORE" HEAD)"
          fi
          services=()
          for service in auth-service api-gateway product-service payment-service order-service notification-service; do
            [[ -f "$service/build.gradle" ]] || continue
            # Test/load/observation tools still run verification, but do not recreate every VPS app.
            # Runtime infrastructure/Compose changes affect all services; module changes select that app.
            if grep -Eq "^($service/|infrastructure/(postgres/|rabbitmq/|scripts/(deploy|verify-infrastructure|smoke-auth)\.sh$)|docker-compose[^/]*\.yml$)" <<< "$paths"; then
              services+=("$service")
            fi
          done
          json="$(printf '%s\n' "${services[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          printf 'services=%s\n' "$json" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Java tests and artifacts
        id: java
        run: |
          set -euo pipefail
          for service in auth-service api-gateway product-service order-service payment-service notification-service; do
            [[ -f "$service/build.gradle" ]] || continue
            (cd "$service" && ./gradlew clean test bootJar --no-daemon)
          done
          for script in infrastructure/scripts/*.sh infrastructure/postgres/*.sh; do bash -n "$script"; done
          bash infrastructure/scripts/verify-rpc-contract.sh
          pwsh -File infrastructure/scripts/export-openapi.ps1
      - name: Verify infrastructure and real service integration
        id: live
        run: |
          set -euo pipefail
          bash infrastructure/scripts/generate-env.sh
          docker compose up -d --wait --wait-timeout 180 postgres rabbitmq
          docker compose run --rm --no-deps rabbitmq-topology
          bash infrastructure/scripts/verify-infrastructure.sh
          services=(auth-service)
          for service in api-gateway product-service order-service payment-service notification-service; do
            [[ ! -f "$service/build.gradle" ]] || services+=("$service")
          done
          docker compose build "${services[@]}"
          if [[ -f api-gateway/build.gradle ]]; then
            docker compose up -d --wait --wait-timeout 120 redis
          fi
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --wait --wait-timeout 180 postgres rabbitmq
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --no-deps --wait --wait-timeout 240 "${services[@]}"
          # CI databases are empty: let Hibernate create service-owned base tables first.
          # VPS rollout still applies migrations before recreating an existing service.
          for service in auth-service product-service order-service payment-service notification-service; do
            bash infrastructure/scripts/apply-schema.sh "$service"
          done
          OPENAPI_LIVE_TEST=true bash infrastructure/scripts/test-auth-live.sh
          if [[ -f api-gateway/build.gradle ]]; then
            (cd api-gateway && GATEWAY_FAILURE_TEST=true ./gradlew liveTest --no-daemon)
          fi
          if [[ -f product-service/build.gradle ]]; then
            JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)" PRODUCT_RPC_TOKEN="$(sed -n 's/^PRODUCT_RPC_TOKEN=//p' .env)" PRODUCT_RPC_LIVE_TEST=true product-service/gradlew -p product-service liveTest --no-daemon
          fi
          if [[ -f order-service/build.gradle ]]; then
            JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)" ORDER_LIVE_DB_PASSWORD="$(sed -n 's/^ORDER_DB_PASSWORD=//p' .env)" RABBITMQ_LIVE_USER="$(sed -n 's/^RABBITMQ_DEFAULT_USER=//p' .env)" RABBITMQ_LIVE_PASSWORD="$(sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' .env)" ORDER_OUTBOX_FAILURE_TEST=true ORDER_SAGA_LIVE_TEST=true SAGA_RECOVERY_TEST=true order-service/gradlew -p order-service liveTest --no-daemon
          fi
          if [[ -f payment-service/build.gradle ]]; then
            docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --wait --wait-timeout 180 rabbitmq
            docker compose run --rm --no-deps rabbitmq-topology
            JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)" PAYMENT_LIVE_DB_PASSWORD="$(sed -n 's/^PAYMENT_DB_PASSWORD=//p' .env)" ORDER_LIVE_DB_PASSWORD="$(sed -n 's/^ORDER_DB_PASSWORD=//p' .env)" NOTIFICATION_LIVE_DB_PASSWORD="$(sed -n 's/^NOTIFICATION_DB_PASSWORD=//p' .env)" RABBITMQ_LIVE_USER="$(sed -n 's/^RABBITMQ_DEFAULT_USER=//p' .env)" RABBITMQ_LIVE_PASSWORD="$(sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' .env)" payment-service/gradlew -p payment-service liveTest --no-daemon
          fi
          if [[ -f notification-service/build.gradle ]]; then
            JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)" NOTIFICATION_LIVE_DB_PASSWORD="$(sed -n 's/^NOTIFICATION_DB_PASSWORD=//p' .env)" RABBITMQ_LIVE_USER="$(sed -n 's/^RABBITMQ_DEFAULT_USER=//p' .env)" RABBITMQ_LIVE_PASSWORD="$(sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' .env)" NOTIFICATION_RECOVERY_TEST=true notification-service/gradlew -p notification-service liveTest --no-daemon
          fi
      - name: Verify VNPay callbacks, full-order returns and durable refund recovery on PostgreSQL
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.vnpay-test.yml up -d --no-deps --wait --wait-timeout 180 payment-service
          export JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)"
          export PAYMENT_LIVE_DB_PASSWORD="$(sed -n 's/^PAYMENT_DB_PASSWORD=//p' .env)"
          export ORDER_LIVE_DB_PASSWORD="$(sed -n 's/^ORDER_DB_PASSWORD=//p' .env)"
          export VNPAY_LIVE_TEST=true VNPAY_RECOVERY_TEST=true
          export VNPAY_LIVE_HASH_SECRET=public-fixture-signing-key-only
          payment-service/gradlew -p payment-service liveTest --tests '*VnpayLiveTests' --tests '*VnpayRefundPgLiveTests' --no-daemon
      - name: Verify SMTP recipient, replay, outage and Notification restart
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.smtp-test.yml --profile smtp-test up -d --wait --wait-timeout 180 mailpit
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.smtp-test.yml --profile smtp-test up -d --no-deps --wait --wait-timeout 180 notification-service
          export JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)"
          export NOTIFICATION_LIVE_DB_PASSWORD="$(sed -n 's/^NOTIFICATION_DB_PASSWORD=//p' .env)"
          export RABBITMQ_LIVE_USER="$(sed -n 's/^RABBITMQ_DEFAULT_USER=//p' .env)"
          export RABBITMQ_LIVE_PASSWORD="$(sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' .env)"
          SMTP_LIVE_TEST=true notification-service/gradlew -p notification-service liveTest --tests '*EmailLiveTests' --no-daemon
      - name: Verify multi-account catalog, orders and payment Saga at small load
        run: |
          set -euo pipefail
          mkdir -p .verification ci-diagnostics
          curl -fLsS --max-time 120 https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz -o .verification/k6.tar.gz
          echo '39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  .verification/k6.tar.gz' | sha256sum -c -
          tar -xzf .verification/k6.tar.gz -C .verification
          export JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)"
          export ORDER_LIVE_DB_PASSWORD="$(sed -n 's/^ORDER_DB_PASSWORD=//p' .env)"
          export ORDER_LIVE_DB_URL=jdbc:postgresql://localhost:15432/order_db
          export LOAD_BASE_URL=http://127.0.0.1:8080 BASE_URL=http://127.0.0.1:8080
          export LOAD_FIXTURE_FILE="$PWD/.verification/multi-fixture.json" FIXTURE_FILE="$PWD/.verification/multi-fixture.json"
          export LOAD_ACCOUNTS=2 LOAD_STOCK=50 RATE=1 DURATION=10s
          order-service/gradlew -p order-service multiUserLoadFixture -PfixtureAction=prepare --no-daemon
          bash infrastructure/scripts/sample-resources.sh 300 > ci-diagnostics/load-resources.csv &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          bash infrastructure/scripts/profile-snapshot.sh > ci-diagnostics/load-before.txt
          for phase in warmup catalog orders e2e; do
            (( $(awk '/^MemAvailable:/ {print $2}' /proc/meminfo) >= 524288 ))
            (( $(df -Pk . | awk 'NR==2 {print $4}') >= 4194304 ))
            export PHASE="$phase"
            [[ "$phase" != warmup ]] || export PHASE=catalog
            export SUMMARY_FILE="$PWD/ci-diagnostics/$phase-load.json"
            .verification/k6-v2.3.0-linux-amd64/k6 run tests/k6/multi-user-load.js
            bash infrastructure/scripts/profile-snapshot.sh > "ci-diagnostics/$phase-after.txt"
            export LOAD_RESULT_FILE="$PWD/ci-diagnostics/$phase-reconciliation.json"
            if [[ "$phase" == orders ]]; then order-service/gradlew -p order-service multiUserLoadFixture -PfixtureAction=finish --no-daemon; fi
            if [[ "$phase" == e2e ]]; then order-service/gradlew -p order-service multiUserLoadFixture -PfixtureAction=verify --no-daemon; fi
          done
      - name: Verify monitoring targets, dashboards and persisted history
        run: |
          set -euo pipefail
          export MONITOR_DB_PASSWORD="$(sed -n 's/^MONITOR_DB_PASSWORD=//p' .env)"
          export GRAFANA_ADMIN_PASSWORD="$(sed -n 's/^GRAFANA_ADMIN_PASSWORD=//p' .env)"
          bash infrastructure/scripts/provision-monitoring.sh
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.monitoring.yml --profile monitoring up -d --no-deps --wait --wait-timeout 240 prometheus grafana node-exporter postgres-exporter redis-exporter
          mkdir -p .verification ci-diagnostics
          pwsh -File infrastructure/scripts/verify-observability-live.ps1 -EvidenceFile ci-diagnostics/observability.json
      - name: Verify trace privacy against persisted Tempo data
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile tracing up -d --no-deps tempo otel-collector
          for attempt in {1..60}; do
            curl -fsS --max-time 5 http://127.0.0.1:13200/ready >/dev/null && break || sleep 2
          done
          pwsh -File infrastructure/scripts/verify-trace-privacy.ps1 -EvidenceFile ci-diagnostics/trace-privacy.json
      - name: Verify instrumented business trace and exporter outage recovery
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile tracing up -d otel-agent-init
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.smtp-test.yml -f docker-compose.tracing.yml --profile smtp-test --profile tracing up -d --no-deps --wait --wait-timeout 240 auth-service api-gateway product-service order-service payment-service notification-service
          export JWT_SECRET="$(sed -n 's/^JWT_SECRET=//p' .env)"
          export ORDER_LIVE_DB_PASSWORD="$(sed -n 's/^ORDER_DB_PASSWORD=//p' .env)"
          export ORDER_LIVE_DB_URL=jdbc:postgresql://localhost:15432/order_db
          export LOAD_BASE_URL=http://127.0.0.1:8080 BASE_URL=http://127.0.0.1:8080
          export LOAD_FIXTURE_FILE="$PWD/.verification/trace-fixture.json" FIXTURE_FILE="$PWD/.verification/trace-fixture.json"
          trace_id="$(openssl rand -hex 16)"
          export TRACEPARENT="00-$trace_id-$(openssl rand -hex 8)-01"
          export LOAD_ACCOUNTS=2 LOAD_STOCK=20 RATE=1 DURATION=5s PHASE=e2e REQUEST_RUN=trace
          export SUMMARY_FILE="$PWD/ci-diagnostics/trace-business-load.json"
          order-service/gradlew -p order-service multiUserLoadFixture -PfixtureAction=prepare --no-daemon
          .verification/k6-v2.3.0-linux-amd64/k6 run tests/k6/multi-user-load.js
          export LOAD_RESULT_FILE="$PWD/ci-diagnostics/trace-business-reconciliation.json"
          order-service/gradlew -p order-service multiUserLoadFixture -PfixtureAction=verify --no-daemon
          pwsh -File infrastructure/scripts/verify-tracing-live.ps1 -TraceId "$trace_id" -EvidenceFile ci-diagnostics/tracing-business.json
          collector="$(docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile tracing ps -q otel-collector)"
          test -n "$collector"
          trap 'docker start "$collector" >/dev/null' EXIT
          docker stop --time 5 "$collector" >/dev/null
          export REQUEST_RUN=outage DURATION=3s SUMMARY_FILE="$PWD/ci-diagnostics/trace-outage-load.json"
          .verification/k6-v2.3.0-linux-amd64/k6 run tests/k6/multi-user-load.js
          export LOAD_RESULT_FILE="$PWD/ci-diagnostics/trace-outage-reconciliation.json"
          order-service/gradlew -p order-service multiUserLoadFixture -PfixtureAction=verify --no-daemon
          docker start "$collector" >/dev/null
          trap - EXIT
      - name: Verify Docker audit collection and privacy in Loki
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.logging.yml --profile logging up -d --no-deps loki alloy
          pwsh -File infrastructure/scripts/verify-logging-live.ps1 -EvidenceFile ci-diagnostics/logging.json
      - name: Save bounded failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker compose ps > ci-diagnostics/containers.txt
          for entry in 'gateway:8080' 'product:8082' 'order:8083'; do
            name="${entry%%:*}"
            port="${entry#*:}"
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/actuator/prometheus" \
              | grep -E '^(commerce_(order_product_rpc|product_rpc)|spring_cloud_gateway_requests)' \
              > "ci-diagnostics/$name-metrics.txt" || true
          done
      - name: Save Java reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
            */build/openapi/*.json
            docs/openapi/*.json
            ci-diagnostics/
      - name: Save tested artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tested-jars
          path: '*/build/libs/app.jar'
          retention-days: 7
      - name: Stop CI containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.smtp-test.yml -f docker-compose.monitoring.yml -f docker-compose.tracing.yml -f docker-compose.logging.yml --profile smtp-test --profile monitoring --profile tracing --profile logging down
      - name: Record verification by numbered milestone
        if: always()
        env:
          MILESTONE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          JAVA_RESULT: ${{ steps.java.outcome }}
          LIVE_RESULT: ${{ steps.live.outcome }}
        run: |
          {
            printf '### %s\n\n' "${MILESTONE:-$(git log -1 --format=%s)}"
            printf -- '- Commit tested: `%s`\n' "$GITHUB_SHA"
            printf -- '- Time (UTC): `%s`\n' "$(date -u +%FT%TZ)"
            printf -- '- Java tests/build: %s\n' "$JAVA_RESULT"
            printf -- '- Real infrastructure/API/restart: %s\n' "$LIVE_RESULT"
            printf -- '- Reports: java-test-reports\n'
          } >> "$GITHUB_STEP_SUMMARY"

  observability-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector, logging and alert configurations with pinned images
        run: bash infrastructure/scripts/verify-observability-config.sh

  publish:
    needs: [changes, verify, observability-config]
    if: github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-jars
          path: .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile.runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record published service
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
          RESULT: ${{ steps.image.outcome }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf '### %s\n\n' "$(git log -1 --format=%s)"
            printf -- '- GHCR %s: %s\n' "$SERVICE" "$RESULT"
            printf -- '- SHA: `%s`; digest: `%s`\n' "$GITHUB_SHA" "$DIGEST"
            printf -- '- Time (UTC): `%s`\n' "$(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [changes, publish]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: vps-service-deployment
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_PATH }}
      IMAGE_TAG: ${{ github.sha }}
      SERVICES: ${{ needs.changes.outputs.services }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure strict SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Transfer immutable release
        run: |
          set -euo pipefail
          tar -czf release.tar.gz docker-compose.yml docker-compose.production.yml infrastructure
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_ROOT/releases/$IMAGE_TAG'"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes release.tar.gz "$VPS_USER@$VPS_HOST:$DEPLOY_ROOT/releases/$IMAGE_TAG/"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_ROOT/releases/$IMAGE_TAG' && tar -xzf release.tar.gz && test -f '$DEPLOY_ROOT/.env' && ln -sfn '$DEPLOY_ROOT/.env' .env"
      - name: Deploy changed services with individual image SHAs
        id: rollout
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r service; do
            [[ "$service" =~ ^(auth-service|api-gateway|product-service|order-service|payment-service|notification-service)$ ]]
            remote="cd '$DEPLOY_ROOT/releases/$IMAGE_TAG' && export DOCKER_CONFIG=\$(mktemp -d) && trap 'rm -f \"\$DOCKER_CONFIG/config.json\"; rmdir \"\$DOCKER_CONFIG\"' EXIT && docker login ghcr.io --username '$REGISTRY_USER' --password-stdin && IMAGE_TAG='$IMAGE_TAG' DEPLOY_SERVICE='$service' DEPLOY_ROOT='$DEPLOY_ROOT' bash infrastructure/scripts/deploy.sh"
            printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$remote"
          done < <(jq -r '.[]' <<< "$SERVICES")
      - name: Record actual deployment
        if: always()
        env:
          RESULT: ${{ steps.rollout.outcome }}
        run: |
          {
            printf '### %s\n\n' "$(git log -1 --format=%s)"
            printf -- '- Changed services: `%s`\n' "$SERVICES"
            printf -- '- Deployment/health/smoke: %s\n' "$RESULT"
            printf -- '- Image SHA: `%s`\n' "$IMAGE_TAG"
            printf -- '- Time (UTC): `%s`\n' "$(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
