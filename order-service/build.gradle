plugins {
    id 'java'
    id 'eclipse'
    id 'com.google.protobuf' version '0.9.5'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.app'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
    implementation enforcedPlatform('io.grpc:grpc-bom:1.84.1')
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'
    implementation 'com.google.protobuf:protobuf-java:3.25.9'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation 'io.grpc:grpc-inprocess'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.9' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.84.1' }
    }
    generateProtoTasks {
        all().each { task -> task.plugins { grpc {} } }
    }
}

eclipse {
    synchronizationTasks 'generateProto'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live'
    }
}

tasks.register('liveTest', Test) {
    description = 'Verify Order skeleton health and database ownership on PostgreSQL'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    outputs.upToDateWhen { false }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.register('loadFixture', JavaExec) {
    description = 'Explicitly prepare/verify/finalize isolated k6 fixtures; credentials come from the process environment'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.app.order.OrderLoadFixture'
    args providers.gradleProperty('fixtureAction').getOrElse('prepare')
}

tasks.register('multiUserLoadFixture', JavaExec) {
    description = 'Prepare and reconcile private multi-account k6 fixtures using real Auth and PostgreSQL'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.app.order.MultiUserLoadFixture'
    jvmArgs '-Xmx128m', '-XX:MaxMetaspaceSize=128m'
    args providers.gradleProperty('fixtureAction').getOrElse('prepare')
}

tasks.register('productionDemoFixture', JavaExec) {
    description = 'Explicitly prepare isolated demo accounts, catalog and workflows through the deployed APIs'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.app.order.ProductionDemoFixture'
    jvmArgs '-Xmx128m', '-XX:MaxMetaspaceSize=128m'
    args providers.gradleProperty('fixtureAction').getOrElse('verify')
}

tasks.named('jar') {
    enabled = false
}

tasks.register('deadLetter', JavaExec) {
    description = 'Inspect or redrive scoped DLQ messages; credentials come from the process environment'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.app.order.DeadLetterTool'
    args providers.gradleProperty('dlqAction').getOrElse('inspect'),
            providers.gradleProperty('dlqQueue').getOrElse('payment.order-created.q')
}
