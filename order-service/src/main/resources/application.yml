server:
  port: 8083
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/order_db}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:commerce_app}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    connection-timeout: 3s
    listener:
      simple:
        prefetch: 1
        missing-queues-fatal: false
        default-requeue-rejected: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        jvm.gc.pause: true
        http.server.requests: true
        spring.cloud.gateway.requests: true
        commerce.order.product.rpc.duration: true
        commerce.product.rpc.duration: true
    tags:
      application: order-service
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  issuer: omnichannel-auth
  ttl: PT1H

product:
  base-url: ${PRODUCT_URL:http://product-service:8082}
  rpc:
    enabled: ${PRODUCT_RPC_ENABLED:false}
    token: ${PRODUCT_RPC_TOKEN:}
    host: ${PRODUCT_RPC_HOST:product-service}
    port: ${PRODUCT_RPC_PORT:9002}
    deadline-ms: ${PRODUCT_RPC_DEADLINE_MS:2500}

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    enabled: false

commerce:
  reservation:
    ttl: ${RESERVATION_TTL:PT5M}
    scan-delay-ms: 1000
