services:
  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [alerts]
    restart: unless-stopped
    mem_limit: 64m
    command: [--config.file=/etc/alertmanager/config.yml, --storage.path=/alertmanager, --data.retention=72h]
    volumes:
      - ${ALERTMANAGER_CONFIG:-./docs/infrastructure/monitoring/alertmanager.yml}:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    ports: [127.0.0.1:19093:9093]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9093/-/ready]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  alertmanager-data:
