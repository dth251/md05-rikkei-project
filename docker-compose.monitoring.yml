services:
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./docs/infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: [127.0.0.1:19090:9090]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    environment:
      GF_SECURITY_ADMIN_USER: ops
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set private GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 384MiB
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docs/infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: [127.0.0.1:13000:3000]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 10

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 48m
    command: [--path.rootfs=/host, --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)]
    volumes:
      - /:/host:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: monitor_user
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:?Set private MONITOR_DB_PASSWORD}

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 48m
    command: [--redis.addr=redis://redis:6379]

volumes:
  prometheus-data:
  grafana-data:
