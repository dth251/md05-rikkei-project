receivers:
  otlp:
    protocols:
      http: {endpoint: '0.0.0.0:4318'}
      grpc: {endpoint: '0.0.0.0:4317'}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 16
  filter/privacy:
    error_mode: propagate
    trace_conditions:
      - Len(span.links) > 0
      - spanevent.name == spanevent.name
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "http.method", "http.status_code", "rpc.system", "rpc.service", "rpc.method", "messaging.system", "messaging.destination.name", "messaging.operation.type", "error.type"])
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name"])
          - keep_keys(instrumentation_scope.attributes, [])
          - set(instrumentation_scope.name, "commerce")
          - set(instrumentation_scope.version, "")
          - set(trace_state, "")
          - set(status.message, "")
          - set(name, "commerce.operation") where name != "commerce.outbox.publish"
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
    timeout: 3s
    sending_queue: {enabled: true, num_consumers: 1, queue_size: 512}
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 60s}
extensions:
  health_check: {endpoint: '0.0.0.0:13133'}
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/privacy, transform/privacy, batch]
      exporters: [otlp/tempo]
